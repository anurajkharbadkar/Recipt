# Puppeteer (apps/api/src/pdf/pdf.service.ts) needs a real Chromium binary
# *and* its system shared libraries (libnss3, libatk, libgbm, etc.) to launch
# at all. Nixpacks' default Node build has neither — Puppeteer's own bundled
# Chromium download has no OS-level libs to run against in that image, which
# is why PDF/pavti-image generation can fail in production with a bare
# "spawn ENOENT" / "error while loading shared libraries" even though it
# works fine locally on a normal desktop OS. Installing the `chromium` nix
# package pulls in a working binary AND its full dependency closure together;
# railway.json points PUPPETEER_EXECUTABLE_PATH at whatever that resolves to
# on PATH at container start (the exact /nix/store/... hash isn't stable
# across builds, so it's resolved at runtime via `which chromium`, not
# hardcoded here).
[phases.setup]
# nodejs_20 has to be listed explicitly alongside chromium — declaring
# [phases.setup] at all REPLACES Nixpacks' auto-detected setup phase
# instead of extending it, which silently dropped Node/npm from the build
# image the moment this file was added (2026-08-20): every build since then
# failed at `npm install -g corepack@0.24.1` with "npm: command not found",
# and Railway kept serving the last successful pre-regression build for
# three days straight while looking healthy (root/health routes don't need
# npm to already be running) until every DB-touching route started 500ing
# once the live DB schema moved ahead of that stale build's Prisma Client.
nixPkgs = ["nodejs_20", "chromium"]

[variables]
# Skip Puppeteer's own Chromium download during `pnpm install` — the nix
# package above is what actually gets used (see PUPPETEER_EXECUTABLE_PATH
# in railway.json), so downloading a second, unused copy just wastes build
# time and can itself fail in constrained build environments.
PUPPETEER_SKIP_DOWNLOAD = "true"
